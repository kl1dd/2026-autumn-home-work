name: Checks

on:
  pull_request:
  merge_group:
    types: [checks_requested]

jobs:
  build:

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle
        run: ./gradlew test integrationTest

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            build/test-results/**
            build/reports/tests/**
          
  code-style-check:

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle
        run: ./gradlew codeStyleChecks

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checkstyle-results
          path: |
            build/reports/checkstyle/**
            build/reports/pmd/**
